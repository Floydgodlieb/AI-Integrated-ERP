# Odoo 20 Community + PostgreSQL 17 for local development.
# Start:   docker compose up -d
# Stop:    docker compose down          (data is kept in the named volumes)
# Wipe:    docker compose down -v       (deletes ALL Odoo data - you get a fresh start)
# Odoo then runs at http://localhost:${ODOO_PORT:-8069}
services:
  db:
    image: postgres:17            # Odoo 20 needs PostgreSQL 16 or newer (15 fails: "any_value does not exist")
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
  odoo:
    image: odoo:20.0
    depends_on: [db]
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
volumes:
  odoo-db:
  odoo-data:
